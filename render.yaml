services:
  - type: web
    name: knowme-reeo
    env: python
    branch: main
    root: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_COOKIE_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANALYTICS_SALT
        sync: false

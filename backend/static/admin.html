<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RobBot — Admin</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 920px; margin: 24px auto; padding: 0 12px; }
    textarea { width: 100%; height: 240px; }
    input[type="text"] { width: 100%; padding: 10px; font-size: 16px; }
    button { padding: 10px 12px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 12px; white-space: pre-wrap; border-radius: 8px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .small { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>RobBot — Admin</h1>
  <p class="small">Paste CV text, ingest, then test questions. Debug shows matches and scoring.</p>

  <h2>1) CV text</h2>
  <textarea id="cv" placeholder="Paste your CV here..."></textarea>
  <div class="row" style="margin-top: 8px;">
    <button id="ingestBtn">Ingest CV</button>
    <span id="ingestStatus" class="small"></span>
  </div>

  <h2 style="margin-top: 18px;">2) Ask</h2>
  <input id="q" type="text" placeholder="e.g., What API experience do you have?" />

  <div class="row" style="margin-top: 8px; justify-content: space-between;">
    <div>
      <label><input id="use_llm" type="checkbox" /> Use LLM rewrite</label>
      <label style="margin-left: 12px;"><input id="debug" type="checkbox" checked /> Debug</label>
    </div>
    <button id="askBtn">Ask</button>
  </div>

  <h2 style="margin-top: 18px;">Output</h2>
  <pre id="out">(no output yet)</pre>

  <script>
    async function postJSON(url, data) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      return await res.json();
    }

    document.getElementById("ingestBtn").addEventListener("click", async () => {
      const text = document.getElementById("cv").value;
      const status = document.getElementById("ingestStatus");
      status.textContent = "Uploading…";
      const resp = await postJSON("/ingest", { text });
      status.textContent = `✅ ${resp.status} (length: ${resp.length})`;
    });

    document.getElementById("askBtn").addEventListener("click", async () => {
      const question = document.getElementById("q").value;
      const use_llm = document.getElementById("use_llm").checked;
      const debug = document.getElementById("debug").checked;

      const resp = await postJSON("/ask", { question, use_llm, debug });
      document.getElementById("out").textContent = JSON.stringify(resp, null, 2);
    });
  </script>
</body>
</html>

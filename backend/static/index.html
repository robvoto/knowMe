<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RobBot — CV Q&A</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 920px; margin: 24px auto; padding: 0 12px; }
    h1 { margin-bottom: 6px; }
    .small { color: #666; font-size: 13px; }
    .card { background: #f7f7f7; padding: 14px; border-radius: 8px; margin-top: 12px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    button { padding: 10px 12px; cursor: pointer; border: 1px solid #ddd; background: white; border-radius: 6px; }
    button:hover { background: #fafafa; }
    input[type="text"] { width: 100%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ddd; }
    #pretty { background:#f5f5f5; padding:12px; border-radius:8px; white-space: pre-wrap; }
    .warn { color: #b00020; }
    .ok { color: #0b6b0b; }
  </style>
</head>
<body>
  <h1>Hi, I’m RobBot</h1>
  <p class="small">
    Ask me questions about <b>Rob Voto</b>’s experience and CV. I answer using CV content (no guessing).
  </p>

  <div class="card">
    <b>Try these questions:</b>
    <div class="row">
      <button class="ex" data-q="What API experience does Rob have? Give concrete examples.">API experience</button>
      <button class="ex" data-q="Has Rob used BPMN? Give concrete project examples.">BPMN examples</button>
      <button class="ex" data-q="What tools has Rob used across business analysis, testing, and delivery?">Tools used</button>
      <button class="ex" data-q="What government departments or industries has Rob worked in?">Departments / industries</button>
      <button class="ex" data-q="What experience does Rob have with data analysis, SQL, or reporting?">Data / SQL</button>
      <button class="ex" data-q="What experience does Rob have with Agile, Scrum, and delivery collaboration?">Agile / Scrum</button>
      <button class="ex" data-q="Has Rob worked with vendors, external teams, or difficult stakeholders? Give examples.">Stakeholder management</button>
      <button class="ex" data-q="What experience does Rob have writing user stories, requirements, or acceptance criteria?">Requirements</button>
      <button class="ex" data-q="Tell me about a time Rob improved a process using a STAR example.">STAR process improvement</button>
      <button class="ex" data-q="Describe a difficult stakeholder situation and how Rob kept alignment using a STAR example.">STAR difficult stakeholder</button>
      <button class="ex" data-q="What experience does Rob have in testing, UAT, or quality assurance?">Testing / UAT</button>
      <button class="ex" data-q="Why would Rob be a strong fit for a senior business analyst or technical BA role?">Why Rob</button>
    </div>
  </div>

  <h2 style="margin-top:18px;">Ask</h2>

  <div class="small" style="margin-bottom:6px;">
  Optional (for context only)
  </div>

  <div class="row" style="gap:8px; margin-bottom:14px;">
    <input id="name" type="text" placeholder="Name (optional)"
            style="flex:1; font-size:14px; padding:6px;" />
    <input id="company" type="text" placeholder="Company (optional)"
            style="flex:1; font-size:14px; padding:6px;" />
  </div>

  <input id="q" type="text"
      placeholder="Type your question"
      style="margin-top:6px;" />

  <div class="row" style="justify-content: space-between;">
    <label class="small"><input id="use_llm" type="checkbox" checked />Use OpenAI</label>
    <button id="askBtn">Ask</button>
  </div>

  <h2 style="margin-top:18px;">Answer</h2>
  <div id="pretty">(no answer yet)</div>
  <p id="status" class="small"></p>

  <script>
    async function postJSON(url, data) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      return await res.json();
    }

    document.querySelectorAll("button.ex").forEach(btn => {
      btn.addEventListener("click", () => {
        document.getElementById("q").value = btn.dataset.q;
      });
    });

    document.getElementById("askBtn").addEventListener("click", async () => {
      const question = document.getElementById("q").value.trim();
      const use_llm = document.getElementById("use_llm").checked;
      const name = document.getElementById("name").value.trim();
      const company = document.getElementById("company").value.trim();
      const pretty = document.getElementById("pretty");
      const status = document.getElementById("status");
      status.textContent = "";

      if (!question) {
        status.innerHTML = "<span class='warn'>Please type a question.</span>";
        return;
      }

      pretty.textContent = "Thinking…";

      const resp = await postJSON("/ask", { question, use_llm, debug: false, name, company });

      if (typeof resp.answer === "string") {
        pretty.textContent = resp.answer;
      } else if (Array.isArray(resp.answer)) {
        pretty.textContent = resp.answer.join("\n");
      } else {
        pretty.textContent = JSON.stringify(resp, null, 2);
      }
    });
  </script>
</body>
</html>
